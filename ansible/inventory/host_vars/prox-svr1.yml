---
svc_name: PVE
svc_check: "systemctl is-active pveproxy"
proxmox_node: prox-svr1
proxmox_api_host: "10.1.0.50"
proxmox_api_user: "root@pam"
proxmox_api_token_id: "ansible"
proxmox_api_token_secret: "{{ prox_svr1_api_token_secret }}"
# prox_svr1_api_token_secret is in vars/secrets.yml (vault-encrypted)

backup_files:
  - { src: "/etc/pve/storage.cfg", dest: "proxmox/storage.cfg" }
  - { src: "/etc/pve/user.cfg", dest: "proxmox/user.cfg" }

# LXC definitions for IaC provisioning
lxc_definitions:
  - vmid: 100
    hostname: caddy
    ip: "10.1.0.51/24"
    gw: "10.1.0.1"
    cores: 2
    memory: 1024
    disk: "local-lvm:8"
    template: "local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst"
    tags: "proxy"
    onboot: true
    docker: false
    alloy: false

  - vmid: 103
    hostname: termix
    ip: "10.1.0.55/24"
    gw: "10.1.0.1"
    cores: 1
    memory: 1024
    disk: "local-lvm:10"
    template: "local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst"
    tags: "management,ssh,terminal"
    onboot: true
    docker: true
    alloy: false

  - vmid: 105
    hostname: uptime-kuma
    ip: "10.1.0.53/24"
    gw: "10.1.0.1"
    cores: 1
    memory: 512
    disk: "data2:8"
    template: "local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst"
    onboot: true
    docker: true
    alloy: false

  # vmid 106 (homepage / gethomepage) destroyed 08-01-2026. it had been running
  # unrouted since home.hartforge.dev replaced it on 07-22 with a static page
  # generated by build-home.py and rsynced to the caddy lxc. final vzdump is at
  # /var/lib/vz/dump/vzdump-lxc-106-2026_08_01-10_11_52.tar.zst on prox-svr1.
  # 106 is free for reuse.

  - vmid: 107
    hostname: forgejo
    ip: "10.1.0.56/24"
    gw: "10.1.0.1"
    cores: 1
    memory: 512
    disk: "data2:8"
    template: "local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst"
    onboot: true
    docker: true
    alloy: false

  - vmid: 108
    hostname: monitoring
    ip: "10.1.0.57/24"
    gw: "10.1.0.1"
    cores: 2
    memory: 2048
    disk: "data2:40"
    template: "local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst"
    onboot: true
    docker: true
    alloy: true

  - vmid: 109
    hostname: pbs
    ip: "10.1.0.58/24"
    gw: "10.1.0.1"
    cores: 2
    memory: 2048
    disk: "local-lvm:500"
    template: "local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst"
    onboot: true
    docker: false
    alloy: false

  # reconciled to the RUNNING container 08-01-2026. this block said vmid 110 with
  # 1 core and a 4G disk; there is no 110 on the node at all (it died with the T7
  # and was rebuilt as 112), and the live container has 2 cores on a 3G disk. a
  # provision-lxc.yml run against adguard would have tried to create a second
  # container rather than match the existing one.
  #
  # the live container also has features=nesting=1, set by hand. the playbook only
  # sets features when docker is true, and adguard runs no containers, so leaving
  # docker false here means a rebuild would NOT reproduce that flag. harmless for
  # adguard itself, noted so it is not a surprise.
  #
  # NOTE: adguard is not actually used as a resolver anywhere - see
  # feedback_adguard_not_in_use. this entry documents what exists, not something
  # that should be depended on.
  - vmid: 112
    hostname: adguard
    ip: "10.1.0.10/24"
    gw: "10.1.0.1"
    cores: 2
    memory: 512
    disk: "local-lvm:3"
    template: "local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst"
    onboot: true
    docker: false
    alloy: false

  - vmid: 111
    hostname: immich
    ip: "10.1.0.59/24"
    gw: "10.1.0.1"
    cores: 4
    memory: 8192
    disk: "data2:40"
    template: "local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst"
    onboot: true
    docker: true
    alloy: false

  # pandemonium - agent question broker + shared kb. routing and sqlite only,
  # it never runs a model, so it stays small.
  - vmid: 113
    hostname: pandemonium
    ip: "10.1.0.60/24"
    gw: "10.1.0.1"
    cores: 2
    memory: 1024
    disk: "data2:8"
    template: "local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst"
    tags: "agents"
    onboot: true
    docker: true
    alloy: true
